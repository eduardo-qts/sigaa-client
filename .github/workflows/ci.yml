name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O toolchain de desenvolvimento (pnpm 11) exige Node >= 22.13.
  verify:
    name: Verificação (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Empacota para o teste de instalação
        if: matrix.node == 22
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
      - name: Guarda o pacote
        if: matrix.node == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error

  # A biblioteca suporta Node >= 20: valida o tarball em cada versão, com npm (sem pnpm).
  # O consumidor (tests/consumer) usa lockfile; o tarball é descompactado em node_modules.
  package:
    name: Pacote no Node ${{ matrix.node }} (npm, ESM, CJS e tipos)
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: ${{ runner.temp }}/pkg
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Importa o pacote em ESM, CJS e TypeScript
        run: |
          cp -r tests/consumer "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm ci
          mkdir -p node_modules/sigaa-client
          tar -xzf "$RUNNER_TEMP"/pkg/sigaa-client-*.tgz --strip-components=1 -C node_modules/sigaa-client
          node esm.mjs
          node cjs.cjs
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 types.ts
