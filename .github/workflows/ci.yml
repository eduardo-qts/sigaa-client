name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build

  package:
    name: Pacote instalável (npm, ESM, CJS e tipos)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Instala o tarball com npm e importa a biblioteca
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/sigaa-client-*.tgz typescript@5 @types/node@20
          cat > esm.mjs <<'EOF'
          import { SigaaClient } from 'sigaa-client';
          new SigaaClient();
          console.log('ESM ok');
          EOF
          cat > cjs.cjs <<'EOF'
          const { SigaaClient } = require('sigaa-client');
          new SigaaClient();
          console.log('CJS ok');
          EOF
          cat > types.ts <<'EOF'
          import { SigaaClient } from 'sigaa-client';
          export const client: SigaaClient = new SigaaClient({ timeoutMs: 5000 });
          EOF
          node esm.mjs
          node cjs.cjs
          npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 types.ts
