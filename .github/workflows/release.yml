name: Release

# Publica no npm ao criar uma tag `vX.Y.Z`.
# Usa "trusted publishing" (OIDC): sem token guardado. Configure uma única vez em
# npmjs.com > sigaa-client > Settings > Trusted Publisher > GitHub Actions
# (usuário eduardo-qts, repositório sigaa-client, workflow release.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing e provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24 # npm >= 11.5.1 é necessário para o trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Confere se a tag coincide com a versão do pacote
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
