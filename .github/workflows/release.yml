name: Release

# Publica no npm ao criar uma tag `vX.Y.Z`.
# Usa "trusted publishing" (OIDC): sem token guardado. Configure uma única vez em
# npmjs.com > sigaa-client > Settings > Trusted Publisher > GitHub Actions
# (usuário eduardo-qts, repositório sigaa-client, workflow release.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing e provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm >= 11.5.1 é necessário para o trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Confere se a tag coincide com a versão do pacote
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
